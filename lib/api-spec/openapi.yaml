openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: contact
    description: Public contact form operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /contact:
    post:
      operationId: createContactSubmission
      tags: [contact]
      summary: Submit a project inquiry
      description: Stores a contact request and returns an acknowledgement.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactRequest"
      responses:
        "201":
          description: The inquiry was accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactResponse"
        "400":
          description: The request did not pass validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many inquiries were submitted from this address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ContactRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 40
        service:
          type: string
          minLength: 1
          maxLength: 120
        budget:
          type: ["string", "null"]
          maxLength: 80
        timeline:
          type: ["string", "null"]
          maxLength: 80
        message:
          type: string
          minLength: 1
          maxLength: 5000
        consent:
          type: boolean
        website:
          type: string
          maxLength: 200
          description: Hidden anti-spam honeypot; must be empty for genuine submissions.
      required:
        - name
        - email
        - service
        - message
        - consent
    ContactResponse:
      type: object
      properties:
        accepted:
          type: boolean
        message:
          type: string
      required:
        - accepted
        - message
    ApiError:
      type: object
      properties:
        message:
          type: string
      required:
        - message

